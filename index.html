<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Werewolf</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="includes/styles.css">
</head>

<body>

    <header class="text-center py-4">
        <h1>Werewolf</h1>
    </header>

    <main class="container">
        <section class="text-center">
            <h2 class="mb-4">Select a Role</h2>

            <!-- Werewolf Button -->
            <button
                type="button"
                class="role-btn btn btn-danger"
                data-bs-toggle="modal"
                data-bs-target="#card-wolf"
            >
                Werewolf
            </button>

            <!-- Seer Button -->
            <button
                type="button"
                class="role-btn btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#card-seer"
            >
                Seer
            </button>
        </section>
    </main>


    <!-- ========================= -->
    <!-- Werewolf Modal             -->
    <!-- ========================= -->

    <div
        class="modal fade"
        id="card-wolf"
        tabindex="-1"
        aria-labelledby="wolfLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title" id="wolfLabel">
                        Werewolf
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>

                <div class="modal-body text-center">

                    <p>
                        Each night, wake with the other Werewolves
                        and choose a player to eliminate.
                    </p>

                    <div class="counter-container">

                        <button
                            type="button"
                            class="num minus btn btn-secondary"
                        >
                            -
                        </button>

                        <div class="number-display">
                            0
                        </div>

                        <button
                            type="button"
                            class="num plus btn btn-secondary"
                        >
                            +
                        </button>

                    </div>

                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-primary"
                        data-bs-dismiss="modal"
                    >
                        OK
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- ========================= -->
    <!-- Seer Modal                -->
    <!-- ========================= -->

    <div
        class="modal fade"
        id="card-seer"
        tabindex="-1"
        aria-labelledby="seerLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title" id="seerLabel">
                        Seer
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>

                <div class="modal-body text-center">

                    <p>
                        Each night choose a player to learn
                        if he is a Villager or a Werewolf.
                    </p>

                    <div class="counter-container">

                        <button
                            type="button"
                            class="num minus btn btn-secondary"
                        >
                            -
                        </button>

                        <div class="number-display">
                            0
                        </div>

                        <button
                            type="button"
                            class="num plus btn btn-secondary"
                        >
                            +
                        </button>

                    </div>

                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-primary"
                        data-bs-dismiss="modal"
                    >
                        OK
                    </button>
                </div>

            </div>
        </div>
    </div>


    <footer class="text-center py-4">
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Your JavaScript -->
    <script src="includes/script.js"></script>

</body>
</html>
